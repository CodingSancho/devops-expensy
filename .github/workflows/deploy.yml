name: Build and deploy to AKS

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  RESOURCE_GROUP: viktor-rg
  AKS_CLUSTER: viktor-expensy
  ACR_NAME: viktorexpensyacr
  ACR_LOGIN_SERVER: viktorexpensyacr.azurecr.io
  BACKEND_IMAGE: viktor-expensy-backend
  FRONTEND_IMAGE: viktor-expensy-frontend
  K8S_NAMESPACE: viktor-expensy

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build backend
        working-directory: backend
        run: |
          npm ci
          npm run build

      - name: Build frontend
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: /
        run: |
          npm ci
          npm run build

      - name: Log in to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push backend image
        run: |
          docker build \
            -t "$ACR_LOGIN_SERVER/$BACKEND_IMAGE:${{ github.sha }}" \
            -t "$ACR_LOGIN_SERVER/$BACKEND_IMAGE:latest" \
            ./backend
          docker push "$ACR_LOGIN_SERVER/$BACKEND_IMAGE:${{ github.sha }}"
          docker push "$ACR_LOGIN_SERVER/$BACKEND_IMAGE:latest"

      - name: Build and push frontend image
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_API_URL=/ \
            -t "$ACR_LOGIN_SERVER/$FRONTEND_IMAGE:${{ github.sha }}" \
            -t "$ACR_LOGIN_SERVER/$FRONTEND_IMAGE:latest" \
            ./frontend
          docker push "$ACR_LOGIN_SERVER/$FRONTEND_IMAGE:${{ github.sha }}"
          docker push "$ACR_LOGIN_SERVER/$FRONTEND_IMAGE:latest"

      - name: Prepare Kubernetes manifests
        env:
          APP_DOMAIN: ${{ secrets.APP_DOMAIN }}
          CERT_MANAGER_EMAIL: ${{ secrets.CERT_MANAGER_EMAIL }}
        run: |
          test -n "$APP_DOMAIN"
          test -n "$CERT_MANAGER_EMAIL"

          mkdir -p rendered-k8s
          cp \
            k8s/namespace.yaml \
            k8s/configmap.yaml \
            k8s/mongo.yaml \
            k8s/redis.yaml \
            k8s/backend.yaml \
            k8s/frontend.yaml \
            k8s/ingress.yaml \
            k8s/cluster-issuer.yaml \
            k8s/hpa.yaml \
            rendered-k8s/

          sed -i "s#viktorexpensyacr.azurecr.io/viktor-expensy-backend:latest#$ACR_LOGIN_SERVER/$BACKEND_IMAGE:${{ github.sha }}#g" rendered-k8s/backend.yaml
          sed -i "s#viktorexpensyacr.azurecr.io/viktor-expensy-frontend:latest#$ACR_LOGIN_SERVER/$FRONTEND_IMAGE:${{ github.sha }}#g" rendered-k8s/frontend.yaml
          sed -i "s#REPLACE_WITH_DOMAIN#$APP_DOMAIN#g" rendered-k8s/ingress.yaml
          sed -i "s#REPLACE_WITH_EMAIL@example.com#$CERT_MANAGER_EMAIL#g" rendered-k8s/cluster-issuer.yaml

      - name: Configure kubectl
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBE_CONFIG }}" > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      - name: Create Kubernetes app secret
        env:
          MONGO_INITDB_ROOT_USERNAME: ${{ secrets.MONGO_INITDB_ROOT_USERNAME }}
          MONGO_INITDB_ROOT_PASSWORD: ${{ secrets.MONGO_INITDB_ROOT_PASSWORD }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
        run: |
          test -n "$MONGO_INITDB_ROOT_USERNAME"
          test -n "$MONGO_INITDB_ROOT_PASSWORD"
          test -n "$REDIS_PASSWORD"

          kubectl create secret generic viktor-expensy-secret \
            --namespace "$K8S_NAMESPACE" \
            --from-literal=MONGO_INITDB_ROOT_USERNAME="$MONGO_INITDB_ROOT_USERNAME" \
            --from-literal=MONGO_INITDB_ROOT_PASSWORD="$MONGO_INITDB_ROOT_PASSWORD" \
            --from-literal=REDIS_PASSWORD="$REDIS_PASSWORD" \
            --dry-run=client \
            -o yaml | kubectl apply -f -

      - name: Deploy to AKS
        run: |
          kubectl apply -f rendered-k8s/
          kubectl rollout status deployment/backend -n "$K8S_NAMESPACE" --timeout=180s
          kubectl rollout status deployment/frontend -n "$K8S_NAMESPACE" --timeout=180s
