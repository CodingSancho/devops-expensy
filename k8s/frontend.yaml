apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: viktor-expensy
  labels:
    app: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: viktorexpensyacr.azurecr.io/viktor-expensy-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: NEXT_PUBLIC_API_URL
              value: "/"
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: viktor-expensy
spec:
  type: ClusterIP
  selector:
    app: frontend
  ports:
    - name: http
      port: 80
      targetPort: 3000
