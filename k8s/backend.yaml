apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: viktor-expensy
  labels:
    app: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: viktorexpensyacr.azurecr.io/viktor-expensy-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8706
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          env:
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: viktor-expensy-config
                  key: BACKEND_PORT
            - name: MONGO_INITDB_ROOT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: viktor-expensy-secret
                  key: MONGO_INITDB_ROOT_USERNAME
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: viktor-expensy-secret
                  key: MONGO_INITDB_ROOT_PASSWORD
            - name: DATABASE_URI
              value: "mongodb://$(MONGO_INITDB_ROOT_USERNAME):$(MONGO_INITDB_ROOT_PASSWORD)@mongo:27017/expenses?authSource=admin"
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: viktor-expensy-config
                  key: REDIS_HOST
            - name: REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: viktor-expensy-config
                  key: REDIS_PORT
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: viktor-expensy-secret
                  key: REDIS_PASSWORD
          readinessProbe:
            httpGet:
              path: /health
              port: 8706
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8706
            initialDelaySeconds: 20
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: viktor-expensy
spec:
  type: ClusterIP
  selector:
    app: backend
  ports:
    - name: http
      port: 8706
      targetPort: 8706
